[workspace]
members = ["crates/tsumiba-core", "crates/tsumiba"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/hjosugi/tsumiba"
homepage = "https://hjosugi.github.io/tsumiba/"
authors = ["hjosugi"]

[profile.dev]
# Line tables keep backtraces and panic locations useful without the cost of
# full debug info for every crate in the tree.
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
