name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        tsumiba is deliberately small: notes and files, nothing else (no clipboard history, no sync service).
        Ideas that fit that are very welcome.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
