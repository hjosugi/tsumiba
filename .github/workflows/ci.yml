name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (build, lint, test, GUI smoke)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies and the headless GUI toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxcb1-dev libxcb-randr0-dev libxkbcommon-dev libxkbcommon-x11-0 libx11-dev \
            libwayland-dev libgl1-mesa-dri libglx-mesa0 libegl1 \
            xvfb xdotool
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build (release)
        run: cargo build --release --locked
      - name: Binary reports its version
        run: ./target/release/tsumiba --version
      - uses: actions/upload-artifact@v7
        with:
          name: tsumiba-linux-x86_64
          path: target/release/tsumiba
          if-no-files-found: error
      - name: GUI smoke test (summon, dismiss, type, quit) under Xvfb
        run: scripts/smoke-gui-linux.sh ./target/release/tsumiba

  windows:
    name: Windows (build, lint, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build (release)
        run: cargo build --release --locked
      - name: Binary reports its version
        run: ./target/release/tsumiba.exe --version
      # Informational: a runner has no GPU, so this also shows whether the window
      # can be created without one. It does not fail the build.
      - name: GUI launch (informational)
        continue-on-error: true
        shell: pwsh
        run: scripts/smoke-gui-windows.ps1 target\release\tsumiba.exe
      - uses: actions/upload-artifact@v7
        with:
          name: tsumiba-windows-x86_64
          path: target/release/tsumiba.exe
          if-no-files-found: error

  macos:
    name: macOS (build, lint, test)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build (release)
        run: cargo build --release --locked
      - name: Binary reports its version
        run: ./target/release/tsumiba --version
      - name: GUI launch (informational)
        continue-on-error: true
        run: scripts/smoke-gui-macos.sh target/release/tsumiba
      - uses: actions/upload-artifact@v7
        with:
          name: tsumiba-macos-arm64
          path: target/release/tsumiba
          if-no-files-found: error

  extension:
    name: Browser extension (build, test)
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: tsumiba-linux-x86_64
          path: bin
      - run: chmod +x bin/tsumiba
      - name: Build both browsers' packages
        run: node extension/build.mjs
      - name: Unit and integration tests, against the real tsumiba binary
        working-directory: extension
        env:
          TSUMIBA_BIN: ${{ github.workspace }}/bin/tsumiba
        run: npm test
      # Informational: needs a Chromium that still honours --load-extension, which
      # branded Chrome no longer does, so fetch Chrome for Testing.
      - name: Real-browser tests (informational)
        continue-on-error: true
        working-directory: extension
        env:
          TSUMIBA_BIN: ${{ github.workspace }}/bin/tsumiba
        run: |
          CHROMIUM_BIN="$(npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/browsers" | awk '{print $2}')"
          echo "using $CHROMIUM_BIN"
          export CHROMIUM_BIN
          npm test
      - uses: actions/upload-artifact@v7
        with:
          name: extension-packages
          path: extension/dist/*.zip
          if-no-files-found: error

  nix:
    name: Nix (flake check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Build the package and the dev shell
        run: |
          nix build .#default --print-build-logs
          nix develop -c cargo --version
      - name: The packaged binary runs
        run: ./result/bin/tsumiba --version
