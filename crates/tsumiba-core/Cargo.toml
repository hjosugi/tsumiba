[package]
name = "tsumiba-core"
description = "Storage, configuration and wire types behind the tsumiba memo and file shelf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["notes", "shelf", "files", "productivity"]
categories = ["filesystem"]

[dependencies]
directories = "6.0.0"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
